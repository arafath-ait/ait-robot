<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIT Smart Robot Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #00ffcc; }
        .card {
            background: #1e1e1e;
            padding: 15px;
            margin: 15px auto;
            border-radius: 10px;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        button {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 20px;
            margin: 8px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { background-color: #00b386; transform: scale(0.95); }
        .mode-btn { background-color: #ff9900; color: #fff; }
        .stop-btn { background-color: #ff3333; color: #fff; }
        input[type="text"] {
            padding: 10px;
            width: 70%;
            border-radius: 5px;
            border: none;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <h1>AIT Robot Controller</h1>
    <p>ESP IP: <span id="ipDisplay">10.130.105.120</span></p>

    <!-- മോഡ് സെലക്ഷൻ കാർഡ് -->
    <div class="card">
        <h3>Select Mode</h3>
        <button class="mode-btn" onclick="sendCommand('M')">Manual Mode</button>
        <button class="mode-btn" onclick="sendCommand('O')">Following Mode</button>
        <button class="mode-btn" onclick="sendCommand('C')">Canvas Mode</button>
    </div>

    <!-- റിമോട്ട് കൺട്രോൾ കാർഡ് -->
    <div class="card">
        <h3>Remote Control</h3>
        <button onclick="sendCommand('F')">Forward</button><br>
        <button onclick="sendCommand('L')">Left</button>
        <button class="stop-btn" onclick="sendCommand('S')">STOP</button>
        <button onclick="sendCommand('R')">Right</button><br>
        <button onclick="sendCommand('B')">Backward</button>
    </div>

    <!-- സർവോ ഹെഡ് കൺട്രോൾ കാർഡ് -->
    <div class="card">
        <h3>Head Control (Servo)</h3>
        <button onclick="sendCommand('X')">Look Right</button>
        <button onclick="sendCommand('H')">Look Center</button>
        <button onclick="sendCommand('Y')">Look Left</button>
    </div>

    <!-- വോയ്സ് കമാൻഡ് കാർഡ് -->
    <div class="card">
        <h3>Voice Command</h3>
        <button onclick="startVoiceRecognition()" style="background-color: #3399ff; color: white;">🎤 Speak Command</button>
        <p id="voiceResult" style="margin-top: 10px; color: #00ffcc;"></p>
    </div>

    <script>
        // ESP IP അഡ്രസ്സ് (ചിത്രത്തിൽ കണ്ടത്)
        const espIp = "10.130.105.120";

        function sendCommand(cmd) {
            let url = `http://${espIp}/?cmd=${cmd}`;
            fetch(url, { mode: 'no-cors' })
                .then(response => console.log("Command sent: " + cmd))
                .catch(err => console.error("Error:", err));
        }

        // സ്പീച്ച് ടു ടെക്സ്റ്റ് (Voice Recognition) ഫങ്ഷൻ
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Your browser does not support voice recognition.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; // മലയാളം വേണമെങ്കിൽ 'ml-IN' നൽകാം
            recognition.start();

            recognition.onresult = function(event) {
                let speechText = event.results[0][0].transcript.toLowerCase();
                document.getElementById("voiceResult").innerText = "You said: " + speechText;

                if (speechText.includes("forward") || speechText.includes("munnott")) {
                    sendCommand('F');
                } else if (speechText.includes("backward") || speechText.includes("pinott")) {
                    sendCommand('B');
                } else if (speechText.includes("stop") || speechText.includes("nilkku")) {
                    sendCommand('S');
                } else if (speechText.includes("left") || speechText.includes("idathu")) {
                    sendCommand('L');
                } else if (speechText.includes("right") || speechText.includes("valathu")) {
                    sendCommand('R');
                }
            };
        }
    </script>
</body>
</html>
